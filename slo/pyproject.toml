[project]
name = "slo"
version = "0.3.1"
description = "Python ReAct agent harness, modelled on pi.dev"
authors = [{ name = "Siddharth Ravichandran", email = "sid@core27.co" }]
license = "GPL-2.0-only"
# 01.n: narrowed to <3.12 because the dependency lock file is validated on
# 3.11 only and pipx install is invoked with --python python3.11. Open the
# upper bound to <3.13 once the suite runs green on 3.12.
requires-python = ">=3.11,<3.12"

# Every distribution imported at module scope anywhere under ``src/`` must be
# listed here, even when some other dependency happens to pull it in today.
# A transitive package is not a contract: Typer 0.20 dropped its ``click``
# dependency (it vendors Click as ``typer._click`` now) and ``src/cli/app.py``
# — which imported ``click`` directly — began crashing on every clean
# ``pipx install``. It kept working on dev machines only because the dev-group
# ``black`` drags ``click`` in. ``tests/cli/test_declared_dependencies.py``
# holds this list to the imports.
dependencies = [
    # LLM / LangChain / LangGraph
    "langchain-core (>=0.3.50,<0.4.0)",
    "langchain-anthropic (>=0.3.0,<0.4.0)",
    "langchain-openai (>=0.3.0,<0.4.0)",
    "langgraph (>=0.4.0,<0.5.0)",

    # Provider SDKs — imported directly for typed error handling, and only
    # transitively guaranteed by the langchain-* wrappers above.
    "anthropic (>=0.104.1,<1.0.0)",
    "openai (>=2.38.0,<3.0.0)",

    # Pydantic / settings
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",

    # Tool utilities
    "pathspec (>=1.0.0,<2.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "pypdf (>=5.0.0,<6.0.0)",
    "json5 (>=0.9.25,<0.10.0)",
    "pyyaml (>=6.0.0,<7.0.0)",

    # HTTP client
    "httpx (>=0.28.1,<0.29.0)",
    "httpcore (>=1.0.9,<2.0.0)",
    "aiohttp (>=3.10.0,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",

    # Logging
    "python-json-logger (>=4.0.0,<5.0.0)",

    # Web / TUI
    "textual (>=8.2.7,<9.0.0)",
    "pyperclip (>=1.11.0,<2.0.0)",
    "rich (>=14.0.0,<16.0.0)",
    # AST owner for conventional visible Markdown transcript buffers.
    "markdown-it-py (>=4.2.0,<5.0.0)",
    # Token boundaries for compiler-emitted fenced-code Content spans.
    "pygments (>=2.20.0,<3.0.0)",
    # Floor is 0.26 — the ``_SloGroup`` override targets the vendored-Click
    # ``TyperGroup`` introduced in the 0.20 line, and the lock validates 0.26.x.
    # Keep the ceiling on the next minor: pipx resolves from these bounds, not
    # from poetry.lock, so a wide range ships untested Typer internals.
    "typer (>=0.26,<0.28)",
]

# The pipx user launcher and its packaging-owned import trampoline. The
# installer replaces only ``slo`` with the isolated wrapper after pipx generates both.
[project.scripts]
slo = "src.cli:main"
slo-entry = "src.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
  packages = [
      { include = "src" },
      { include = "config" },
  ]

  # skills/ ships inside the artifact so a non-editable ``pipx install`` finds
  # it. The wheel places it at ``<site-packages>/skills``, which is exactly the
  # path ``cfg._resolve_skills_dir`` derives from ``config/cfg.py``'s location.
  # Without this the installed agent silently starts with vendored_count=0.
  #
  # plugins/ ships for the same reason: the bundled bash_live_output payload is
  # resolved by PluginInstallerService as ``Path(__file__).parents[4] /
  # "plugins" / "bash_live_output"``, which lands at
  # ``<site-packages>/plugins/bash_live_output`` in a pipx install. Without
  # this entry the wheel omits the payload and
  # ``slo plugin install-bundled-bash-live-output`` fails with
  # "plugin source has no readable slo-plugin.json".
  #
  # install.sh ships at ``<site-packages>/install.sh`` so ``slo update`` can run
  # the just-installed copy's ``--finalize-launcher`` before its conditional
  # ``--finalize-environment`` step. The installer is the only wrapper and
  # managed-shell-environment writer.
  include = [
      { path = "skills/**/*", format = ["sdist", "wheel"] },
      { path = "plugins/**/*", format = ["sdist", "wheel"] },
      { path = "install.sh", format = ["sdist", "wheel"] },
  ]
  
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-httpserver (>=1.1.0,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "autoflake (>=2.3.1,<3.0.0)",
    "mypy (>=1.13.0,<2.0.0)",
    "types-PyYAML (==6.0.12.20260906)",
    "debugpy (>=1.8.0,<2.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: integration tests that call real provider APIs or run the installer in Docker (off by default)",
]
addopts = "-m 'not e2e'"

[tool.black]
line-length = 110

[tool.mypy]
strict_optional = true
ignore_missing_imports = true

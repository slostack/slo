# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
# Runner tags are conjunctive. Included runnable jobs inherit this requirement;
# explicit capability tags must repeat both tags (GitLab does not merge arrays).
default:
  tags:
  - mgr-01
  - shared

stages:
- test
- publish
- release-verify
- release
- secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Poetry is pinned to the version that generated slo/poetry.lock (lock-version 2.1).
  POETRY_VERSION: '2.4.1'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  POETRY_NO_INTERACTION: '1'

# Runs the same suite as `make test` in slo/. `slo/environments/tests.env` is
# gitignored, so its (non-secret) contents are reproduced in `variables:` below
# with $CI_PROJECT_DIR/slo substituted for the developer's absolute path.
#
# Scope: the default suite. `addopts = "-m 'not e2e'"` in slo/pyproject.toml
# deselects tests marked `e2e` — those call real provider APIs or run the
# installer in Docker, and need credentials CI does not hold. Run them locally
# with `make install-smoke` / `pytest -m e2e`.
pytest:
  stage: test
  # Full python:3.11 (not -slim): the Git-diff viewer tests shell out to `git`,
  # which the slim image does not ship. slo/pyproject.toml pins python >=3.11,<3.12.
  image: python:3.11
  variables:
    # tests/compat extracts frozen v0.20.1 with git archive; missing tags fail the suite.
    GIT_DEPTH: '0'
    GIT_FETCH_EXTRA_FLAGS: '--tags'
    PYTHONPATH: "$CI_PROJECT_DIR/slo"
    SLO_ENV: test
    SLO_ROOT_DIR: "$CI_PROJECT_DIR/slo"
    SLO_APP_DIR: "$CI_PROJECT_DIR/slo"
    SLO_APP_NAME: slo
    SLO_LOG_FORMAT: text
    SLO_DEFAULT_MODEL_NAME: gpt-5.4
    # Never let a test spawn a real `slo visualize` terminal on the runner.
    SLO_AUTO_VISUALIZE: '0'
    # Not a credential. tests/agents/slo_agent/orchestrator/test_workflow_routing_e2e.py
    # drives a FauxChatModel and makes no network call, but SloAgentSession.build()
    # still resolves provider credentials at construction time. On a developer
    # machine that resolves against ~/.claude/.credentials.json; a CI runner has
    # no such file, so those tests need a placeholder to get past resolution.
    SLO_ANTHROPIC_API_KEY: 'ci-placeholder-tests-are-fully-mocked'
    # Textual pilot tests render to a headless driver; keep the size deterministic.
    COLUMNS: '120'
    LINES: '40'
    # TEMP MR116: natural selection geometry in bounded JUnit user properties.
    SLO_TEST_SELECTION_OBSERVER: '1'
  cache:
    key:
      files:
      - slo/poetry.lock
    paths:
    - .cache/pip
  before_script:
  # slo/poetry.toml sets virtualenvs.create = false, so dependencies install
  # into the image's own Python rather than a project venv.
  - pip install "poetry==$POETRY_VERSION"
  - cd slo
  - poetry install --no-interaction
  # One xdist worker per runner vCPU. The runner VM has 6 vCPUs and runs two jobs
  # at once (MR and push pipelines), so 12 workers per job meant 24 on 6 vCPUs and
  # timing-bound tests failed nondeterministically. Raise this only with the VM's vCPUs.
  script:
  - PYTEST_ADDOPTS="-q --junitxml=../report.xml" make test PYTEST_WORKERS=6
  artifacts:
    when: always
    expire_in: 1 week
    access: developer
    paths:
    - report.xml
    reports:
      junit: report.xml
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH
  - if: $CI_COMMIT_TAG

# Publishes install.sh to the Cloudflare Worker behind get-slo.sh, pinned to the
# tag that triggered the pipeline. This is `make publish-installer` with two
# differences, both deliberate:
#
#   * PUBLISH_SLO_REF is $CI_COMMIT_TAG rather than `git tag | head -1`. The
#     pipeline already knows which tag it is building; asking git would depend
#     on the runner's fetched tag set.
#   * Release mode fetches `slo/install.sh` from the same public immutable
#     tag. It never uses a local `INSTALL_SH` override, so publication proves
#     the hosted artifact's source rather than this runner checkout.
#
# Requires three project CI/CD variables, all masked and protected:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID
#
# IMPORTANT: protected variables are only injected on protected refs. The tag
# must match a protected tag pattern (Settings → Repository → Protected tags,
# e.g. `v*`) or all three arrive empty and the job fails at its guard.
publish-installer:
  stage: publish
  image: python:3.11
  # Tag publication waits for the full non-E2E behavioral test suite in this
  # exact pipeline. Formatting and static analysis are developer-local checks,
  # not CI prerequisites for publishing the tested artifact.
  needs:
  - job: pytest
  variables:
    CF_ZONE_NAME: get-slo.sh
    SLO_HOSTNAME: get-slo.sh
  script:
  - test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is empty — is the tag protected?" >&2; exit 1; }
  - test -n "$CLOUDFLARE_API_TOKEN"  || { echo "CLOUDFLARE_API_TOKEN is empty — is the tag protected?" >&2; exit 1; }
  - test -n "$CLOUDFLARE_ZONE_ID"    || { echo "CLOUDFLARE_ZONE_ID is empty — is the tag protected?" >&2; exit 1; }
  - cd slo
  - SLO_RELEASE_MODE=1 SLO_SOURCE_REF="$CI_COMMIT_TAG" PUBLISH_SLO_REF="$CI_COMMIT_TAG" SLO_SOURCE_PATH=slo/install.sh bash deploy-install-worker.sh
  rules:
  - if: $CI_COMMIT_TAG

# These are release-fatal evidence gates owned by the actual GitLab provider.
# They start only after tagged Worker publication succeeds; local verification
# only parses/collects these contracts and never claims Docker or macOS runs.
# The macOS job requires a registered tagged GitLab runner with the named runner tag.
# Linux images already provide the verified interpreter. With virtualenvs.create=false,
# `poetry env use` tries to write envs.toml into a nonexistent cold-cache directory.
# Install directly, as the default pytest job does; no cache is a correctness prerequisite.
.release-e2e:
  stage: release-verify
  image: python:3.11
  needs:
  - job: publish-installer
  variables:
    SLO_DIRECT_PIPX_RECOVERY_E2E: '1'
    SLO_INSTALL_E2E: '1'
    SLO_LOCAL_WHEEL: "$CI_PROJECT_DIR/slo/dist/slo-*.whl"
    PIPX_BIN_DIR: "$CI_PROJECT_DIR/.tmp/slo-pipx-bin"
  before_script:
  - python3.11 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
  - python3.11 -m pip install "poetry==$POETRY_VERSION"
  # Tool-owned venv survives HOME replacement; recovery explicitly covers pip and uv.
  - python3.11 -m venv "$CI_PROJECT_DIR/.ci-pipx"
  - '"$CI_PROJECT_DIR/.ci-pipx/bin/python" -m pip install pipx==1.18.10 uv==0.13.6'
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - cd slo
  - poetry install --no-interaction
  script:
  - poetry build --format wheel
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - export SLO_LOCAL_WHEEL="$(find "$CI_PROJECT_DIR/slo/dist" -maxdepth 1 -name 'slo-*.whl' -type f -print -quit)"
  - test -n "$SLO_LOCAL_WHEEL"
  - poetry run pytest -o addopts='' tests/cli/test_hosted_installer_smoke.py::test_direct_pipx_regeneration_recovers_through_packaged_finalizer -m e2e -v
  rules:
  - if: $CI_COMMIT_TAG

release-pipx-recovery:
  extends: .release-e2e

release-docker-installer-matrix:
  extends: .release-e2e
  # Explicitly repeat the Debian-based image: this job uses apt to provision
  # its Docker client and must never pair an Alpine-only apk bootstrap with the
  # inherited Python image.
  image: python:3.11
  # The docker:dind daemon is the explicit Docker-capable runner contract.
  # GitLab Runner must allow privileged service containers for this release gate.
  services:
  - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    SLO_DIRECT_PIPX_RECOVERY_E2E: '1'
    SLO_INSTALL_E2E: '1'
    SLO_LOCAL_WHEEL: "$CI_PROJECT_DIR/slo/dist/slo-*.whl"
    PIPX_BIN_DIR: "$CI_PROJECT_DIR/.tmp/slo-pipx-bin"
  parallel:
    matrix:
    - SLO_INSTALL_SMOKE_IMAGE: [ubuntu:22.04, ubuntu:24.04, debian:12, debian:13]
  before_script:
  # Debian trixie splits the CLI from docker.io (only a recommendation).
  # The daemon is the dind service; this image needs only the explicit client.
  - apt-get update && apt-get install -y --no-install-recommends docker-cli
  - python3.11 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
  - python3.11 -m pip install "poetry==$POETRY_VERSION"
  # Tool-owned venv survives the smoke tests replacing HOME.
  - python3.11 -m venv "$CI_PROJECT_DIR/.ci-pipx"
  - '"$CI_PROJECT_DIR/.ci-pipx/bin/python" -m pip install pipx==1.18.10 uv==0.13.6'
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - docker info
  - cd slo
  - poetry install --no-interaction
  script:
  - poetry build --format wheel
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - docker info
  - export SLO_LOCAL_WHEEL="$(find "$CI_PROJECT_DIR/slo/dist" -maxdepth 1 -name 'slo-*.whl' -type f -print -quit)"
  - test -n "$SLO_LOCAL_WHEEL"
  - poetry run pytest -o addopts='' tests/cli/test_install_smoke.py -m e2e -v

.hosted-installer-smoke:
  stage: release-verify
  image: python:3.11
  needs:
  - job: publish-installer
  variables:
    SLO_HOSTED_INSTALL_E2E: '1'
    SLO_RELEASE_TAG: "$CI_COMMIT_TAG"
    SLO_INSTALL_URL: "https://get-slo.sh/install.sh"
    PIPX_BIN_DIR: "$CI_PROJECT_DIR/.tmp/slo-pipx-bin"
  before_script:
  - python3.11 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
  - python3.11 -m pip install "poetry==$POETRY_VERSION"
  # Tool-owned venv survives the smoke tests replacing HOME.
  - python3.11 -m venv "$CI_PROJECT_DIR/.ci-pipx"
  - '"$CI_PROJECT_DIR/.ci-pipx/bin/python" -m pip install pipx==1.18.10 uv==0.13.6'
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - cd slo
  - poetry install --no-interaction
  script:
  - export PATH="$CI_PROJECT_DIR/.ci-pipx/bin:$PATH"
  - command -v pipx
  - pipx --version
  - poetry run pytest -o addopts='' tests/cli/test_hosted_installer_smoke.py -m e2e -v
  rules:
  - if: $CI_COMMIT_TAG

hosted-installer-smoke:
  extends: .hosted-installer-smoke

macos-installer-smoke:
  extends: .hosted-installer-smoke
  # Operator-authorized release repair: skip ONLY macOS, whose runner is unavailable.
  # Linux recovery, all four Docker images and hosted Linux remain mandatory.
  rules:
  - when: never
  needs:
  - job: publish-installer
  image: null
  tags:
  - mgr-01
  - shared
  - macos
  variables:
    SLO_HOSTED_INSTALL_E2E: '1'
    SLO_PLATFORM_SMOKE: macos
    SLO_RELEASE_TAG: "$CI_COMMIT_TAG"
    SLO_INSTALL_URL: "https://get-slo.sh/install.sh"
    PIPX_BIN_DIR: "$CI_PROJECT_DIR/.tmp/slo-pipx-bin"
  before_script:
  - command -v python3.11
  - python3.11 -c 'import sys; assert sys.version_info[:2] == (3, 11)'
  - python3.11 -m pip install "poetry==$POETRY_VERSION"
  - python3.11 -m pip install --user pipx
  - export PATH="$(python3.11 -c 'import site; print(site.USER_BASE)')/bin:$PATH"
  - command -v pipx
  - pipx --version
  - cd slo
  - poetry env use python3.11
  - poetry install --no-interaction
  script:
  - export PATH="$(python3.11 -c 'import site; print(site.USER_BASE)')/bin:$PATH"
  - command -v pipx
  - pipx --version
  - poetry run pytest -o addopts='' tests/cli/test_hosted_installer_smoke.py -m e2e -v

# GitLab is the sole release authority. This API call starts only after all
# mandatory Linux evidence succeeds in the same protected tag pipeline.
create-gitlab-release:
  stage: release
  image: curlimages/curl:8.12.1
  needs:
  - job: release-pipx-recovery
  - job: release-docker-installer-matrix
  - job: hosted-installer-smoke
  - job: macos-installer-smoke
    optional: true
  script:
  - test -n "$CI_JOB_TOKEN" || { echo "CI_JOB_TOKEN is empty." >&2; exit 1; }
  - |
      curl -fsS -X POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{\"name\":\"$CI_COMMIT_TAG\",\"tag_name\":\"$CI_COMMIT_TAG\",\"description\":\"Release $CI_COMMIT_TAG\"}" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  rules:
  - if: $CI_COMMIT_TAG

# The template defaults to allow_failure: true, so a scan that never ran (e.g. the
# runner failed to pull its image) still left the pipeline green. Make it required,
# and retry only infrastructure faults: a finding is a script failure, never retried.
secret_detection:
  stage: secret-detection
  allow_failure: false
  retry:
    max: 2
    when:
    - runner_system_failure
    - runner_configuration_error
    - scheduler_failure

include:
- template: Security/Secret-Detection.gitlab-ci.yml

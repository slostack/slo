version: "3.9"
services:
  postgres:
    image: slo_postgres
    build:
      context: .
      dockerfile: postgres/Dockerfile
    env_file:
      - ./../environments/development.env
    expose:
      - 5437
    ports:
      - "5437:5432"
    volumes:
      - ./../data/postgres/db_data/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    env_file:
      - ./../environments/development.env
    volumes:
      - ./../data/redis/dump.rdb/:/var/lib/redis/dump.rdb/
    expose:
      - 6379
    ports:
      - "6379:6379"
